<section class="analogies-section">
  <p class="section-intro">
    Each concept explained through a familiar, real-world situation — no prior RxJS knowledge
    needed.
  </p>

  @for (topic of topics; track topic) {
    <div class="analogy-card">
      <div class="analogy-card-header">
        <span class="analogy-card-title">{{ topic.title }}</span>
        <span class="topic-tag topic-tag--{{ topic.tag }}">{{ topic.tag }}</span>
      </div>
      <p class="analogy-card-text">{{ topic.analogy }}</p>
      <p class="analogy-card-desc">{{ topic.description }}</p>
    </div>
  }
</section>
